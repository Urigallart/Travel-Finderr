<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1712">
<title>Amic Invisible Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centred glass panel over a falling-snow night, screens slide in like an iOS flow */
:root{
  --night:#0b1712; --night-2:#10241b; --pine:#1d4a35;
  --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.14);
  --ink:#f6f2ea; --ink-soft:rgba(246,242,234,.66); --ink-faint:rgba(246,242,234,.38);
  --red:#d7263d; --red-deep:#9e1426; --gold:#e9c46a; --gold-soft:rgba(233,196,106,.18);
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --text:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);font-family:var(--text);font-size:16px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1200px 700px at 50% -10%, #1f4a37 0%, transparent 60%),
   radial-gradient(900px 500px at 85% 110%, rgba(215,38,61,.18) 0%, transparent 60%),
   linear-gradient(180deg,var(--night-2),var(--night));}
#snow,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:1}#confetti{z-index:5}
.app{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;
  font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.top b{color:var(--gold);font-weight:600}
.screen{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,12vw,76px);line-height:1;margin:8px 0 14px;letter-spacing:-.035em;text-wrap:balance}
h1 em{color:var(--gold);font-style:normal}
h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,8vw,42px);line-height:1.08;letter-spacing:-.03em;margin:0 0 8px;text-wrap:balance}
p.lead{color:var(--ink-soft);font-size:17px;line-height:1.5;max-width:40ch;margin:0 0 28px}
.btn{appearance:none;border:0;cursor:pointer;font:600 17px/1 var(--text);color:#fff;
  background:linear-gradient(180deg,var(--red),var(--red-deep));padding:18px 30px;border-radius:999px;min-width:220px;
  box-shadow:0 10px 30px rgba(215,38,61,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(215,38,61,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;border:1px solid var(--glass-line);font-weight:500}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.actions{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}

.ornament{width:120px;height:120px;margin:4px 0 10px;position:relative;animation:swing 4s ease-in-out infinite;transform-origin:50% -30px}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.ornament::before{content:"";position:absolute;left:50%;top:-30px;width:1px;height:34px;background:var(--gold);opacity:.7}
.ornament .cap{position:absolute;left:50%;top:0;width:26px;height:14px;transform:translateX(-50%);border-radius:4px 4px 2px 2px;
  background:linear-gradient(90deg,#b8902f,var(--gold),#b8902f)}
.ornament .ball{position:absolute;left:10px;top:10px;width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#ff8a95 0%,var(--red) 30%,var(--red-deep) 75%,#5a0b16 100%);
  box-shadow:0 20px 50px rgba(215,38,61,.35)}
.ornament .ball::after{content:"";position:absolute;inset:44% 0 auto;height:10px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 10px);opacity:.75}

.panel{width:100%;background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;padding:22px 18px;
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);text-align:left}
.fam+.fam{margin-top:20px}
.fam-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 4px 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;font:500 16px/1 var(--text);color:var(--ink);background:rgba(255,255,255,.06);
  border:1px solid var(--glass-line);padding:12px 16px;border-radius:999px;transition:background .2s,border-color .2s,transform .15s}
.chip:hover{background:rgba(255,255,255,.12)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.chip.taken{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sticky{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-top:20px;display:flex;justify-content:center;width:100%}

.confirm-name{font-family:var(--display);font-weight:700;letter-spacing:-.035em;font-size:clamp(44px,12vw,64px);color:var(--gold);line-height:1;margin:6px 0 18px}
.warn{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--gold-soft);border:1px solid rgba(233,196,106,.35);
  border-radius:18px;padding:14px 16px;margin:0 0 26px;color:var(--ink);font-size:15px;line-height:1.45;max-width:420px}
.warn svg{flex:none;margin-top:2px}

/* Gift */
.stage{position:relative;width:240px;height:260px;margin:10px 0 0}
.glow{position:absolute;left:50%;top:55%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,240,200,1),rgba(233,196,106,.6) 30%,transparent 70%);opacity:0}
.gift{position:absolute;left:30px;bottom:0;width:180px;height:150px;cursor:pointer}
.gift .box{position:absolute;inset:40px 0 0;border-radius:10px;background:linear-gradient(160deg,#e23a4f,var(--red-deep));
  box-shadow:inset 0 -18px 30px rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.45)}
.gift .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);background:linear-gradient(90deg,#c99a35,var(--gold),#c99a35)}
.gift .lid{position:absolute;left:-10px;right:-10px;top:14px;height:38px;border-radius:8px;background:linear-gradient(160deg,#ef4b5f,#b5182c);
  box-shadow:0 6px 12px rgba(0,0,0,.3);transform-origin:50% 100%}
.gift .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);background:linear-gradient(90deg,#c99a35,var(--gold),#c99a35)}
.bow{position:absolute;left:50%;top:-30px;width:90px;height:44px;transform:translateX(-50%)}
.bow i{position:absolute;top:4px;width:44px;height:34px;border:9px solid var(--gold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.bow i:first-child{left:0;transform:rotate(-18deg)}.bow i:last-child{right:0;transform:rotate(18deg)}
.bow b{position:absolute;left:50%;top:18px;width:18px;height:18px;transform:translateX(-50%);border-radius:5px;background:var(--gold)}
.tap{margin-top:26px;color:var(--ink-soft);font-size:15px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.gift.idle{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.gift.shake{animation:shake .9s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:rotate(-2deg)}20%,80%{transform:rotate(4deg)}30%,50%,70%{transform:rotate(-7deg) translateY(-4px)}40%,60%{transform:rotate(7deg) translateY(-4px)}}
.gift.open .lid{animation:lidoff .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes lidoff{to{transform:translate(70px,-160px) rotate(38deg);opacity:0}}
.gift.open .box{animation:sink .9s .5s ease forwards}
@keyframes sink{to{transform:translateY(40px) scale(.9);opacity:0}}
.glow.burst{animation:burst 1.4s .25s ease-out forwards}
@keyframes burst{0%{opacity:0;width:10px;height:10px}30%{opacity:1}100%{opacity:0;width:620px;height:620px}}

.reveal{display:flex;flex-direction:column;align-items:center}
.reveal .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
.card{position:relative;padding:34px 28px 30px;min-width:min(100%,340px);border-radius:28px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(233,196,106,.4);
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 6px rgba(233,196,106,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  animation:rise 1s cubic-bezier(.2,.9,.2,1.05) both}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.85) rotateX(30deg)}to{opacity:1;transform:none}}
.who{font-family:var(--display);font-weight:700;letter-spacing:-.035em;font-size:clamp(54px,15vw,92px);line-height:1;color:var(--gold);text-shadow:0 0 40px rgba(233,196,106,.35)}
.who span{display:inline-block;opacity:0;transform:translateY(20px);animation:letter .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.who span.sp{width:.25em}
.card small{display:block;margin-top:14px;color:var(--ink-soft);font-size:15px}
.hush{margin:26px 0 22px;color:var(--ink-soft);font-size:15px;max-width:34ch;line-height:1.5}
.testbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;width:100%;max-width:560px;margin:-12px 0 20px;padding:10px 14px;border-radius:14px;
  background:var(--gold);color:#2a1d05;font-size:14px;font-weight:600;text-align:center;line-height:1.35}
.testbar span{font-weight:400}
.foot{margin-top:auto;padding-top:40px;font-size:12px;color:var(--ink-faint);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}.who span{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="sky"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="app">
  <div class="top"><span>Nadal <b>2026</b></span><span id="count">21 participants</span></div>
  <div class="testbar" id="testbar" hidden>MODE PROVA <span>· El nom que surt és inventat i no es desa res.</span></div>
  <div id="view"></div>
  <div class="foot">Cada nom només es pot triar una vegada · No et tocarà ningú de la teva família</div>
</main>

<script>
const FAMILIES = [
  {name:"Família Gallart", people:["Anna","Oriol","Jaume","Maria Alba"]},
  {name:"Família Andorra", people:["Jana","Abner","Neus","Jordi","Gemma"]},
  {name:"Família Subirà",  people:["Ventura","Mireia","Núria","Toni"]},
  {name:"Família Aubert",  people:["Ricard","Maria del Mar","Júlia","Aleix"]},
  {name:"Gabriel, Pau i Helena", people:["Gabriel","Pau","Helena"]},
  {name:"La reina de la casa", people:["Àvia"]}
];
const ENC = {"Anna": "PgAR", "Oriol": "KQAGEwVXXA==", "Jaume": "IwgWBAVT", "Maria Alba": "LwMKBB4=", "Jana": "IKLeEwVT", "Abner": "PAgHAB5W", "Neus": "JKLeDQVT", "Jordi": "Lw0BCBQ=", "Gemma": "OAQKFRlAUQ==", "Ventura": "IwAWCA0SVFdadigPBg==", "Mireia": "JgQIBAJT", "Núria": "Lw8KAA==", "Toni": "JAAKAA==", "Ricard": "IRMNDgA=", "Maria del Mar": "JAARDAk=", "Júlia": "Og4KCA==", "Aleix": "KQQJDA0=", "Gabriel": "IwAWCA0ScV5UJg==", "Pau": "IAQREg==", "Helena": "reESCA0=", "Àvia": "JA4WBQU="};
const LS_KEY = "amic-invisible-2026-v2";
let TEST = location.hash === "#prova";
function fakeFor(me){
  const fam = FAMILIES.find(f => f.people.includes(me));
  const pool = FAMILIES.filter(f => f !== fam).flatMap(f => f.people);
  return pool[Math.random()*pool.length|0];
}
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-");

function decode(giver){
  const bin = atob(ENC[giver]); const key = new TextEncoder().encode("nadal2026"+giver);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i) ^ key[i % key.length];
  return new TextDecoder().decode(out);
}
const store = {
  get(){ if(TEST) return null; try{ return localStorage.getItem(LS_KEY) }catch(e){ return null } },
  set(v){ if(TEST) return; try{ localStorage.setItem(LS_KEY,v) }catch(e){} }
};

/* Shared claims: when the viewer is signed in, a chosen name is marked for everyone */
let db = null, taken = new Set();
(async () => {
  try{
    if(!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if(!db) return;
    db.collection("claims").onSnapshot(snap => {
      taken = new Set(snap.docs.map(d => d.id));
      if(current === "pick") renderPick();
    }, () => {});
  }catch(e){ db = null }
})();
async function claim(name){
  if(TEST || !db) return true;
  try{
    const ref = db.doc("claims/"+slug(name));
    const existing = await ref.get();
    if(existing && existing.exists) return false;
    await ref.set({at: Date.now()});
  }catch(e){}
  return true;
}

const view = document.getElementById("view");
let current = null, selected = null;
function show(html){ view.innerHTML = `<section class="screen">${html}</section>`; window.scrollTo({top:0}); }
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderIntro(){
  current = "intro";
  show(`
    <div class="ornament" aria-hidden="true"><div class="cap"></div><div class="ball"></div></div>
    <h1>Amic<br><em>Invisible</em></h1>
    <p class="lead">Tria el teu nom, obre el regal i descobreix a qui li fas el regal aquest Nadal. Només ho podràs fer una vegada.</p>
    <div class="actions"><button class="btn" id="go">Començar</button></div>`);
  document.getElementById("go").onclick = renderPick;
}

function renderPick(){
  current = "pick";
  const fams = FAMILIES.map(f => `
    <div class="fam"><div class="fam-label">${esc(f.name)}</div><div class="chips">
      ${f.people.map(p => {
        const t = taken.has(slug(p));
        return `<button class="chip${t?" taken":""}" data-p="${esc(p)}" aria-pressed="${selected===p}" ${t?'disabled aria-label="'+esc(p)+', ja triat"':""}>${esc(p)}</button>`;
      }).join("")}
    </div></div>`).join("");
  show(`
    <h2>Qui ets?</h2>
    <p class="lead">Busca el teu nom. Si surt ratllat, algú ja l’ha triat.</p>
    <div class="panel">${fams}</div>
    <div class="sticky"><button class="btn" id="next" ${selected?"":"disabled"}>${selected?"Sóc "+esc(selected):"Selecciona el teu nom"}</button></div>`);
  view.querySelectorAll(".chip:not(.taken)").forEach(b => b.onclick = () => {
    selected = b.dataset.p;
    view.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.p===selected));
    const n = document.getElementById("next"); n.disabled = false; n.textContent = "Sóc " + selected;
  });
  document.getElementById("next").onclick = () => selected && renderConfirm();
}

function renderConfirm(){
  current = "confirm";
  show(`
    <p class="lead" style="margin-bottom:4px">Entraràs com a</p>
    <div class="confirm-name">${esc(selected)}</div>
    <div class="warn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e9c46a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
      <span>Només ho pots fer una vegada. Després aquest dispositiu quedarà vinculat a tu i no podràs triar un altre nom.</span>
    </div>
    <div class="actions">
      <button class="btn" id="yes">Sí, sóc ${esc(selected)}</button>
      <button class="btn ghost" id="no">No, tornar</button>
    </div>`);
  document.getElementById("no").onclick = renderPick;
  document.getElementById("yes").onclick = async e => {
    e.currentTarget.disabled = true;
    const ok = await claim(selected);
    if(!ok){ taken.add(slug(selected)); selected = null; renderPick(); return; }
    store.set(selected);
    renderGift(selected);
  };
}

function renderGift(me){
  current = "gift";
  show(`
    <p class="lead" style="margin-bottom:0">Hola, ${esc(me)}. El teu regal t’espera.</p>
    <div class="stage">
      <div class="glow" id="glow"></div>
      <div class="gift idle" id="gift" role="button" tabindex="0" aria-label="Obrir el regal">
        <div class="box"></div>
        <div class="lid"><div class="bow"><i></i><i></i><b></b></div></div>
      </div>
    </div>
    <div class="tap">Toca el regal per obrir-lo</div>`);
  const g = document.getElementById("gift");
  const open = () => {
    if(g.dataset.busy) return; g.dataset.busy = 1;
    g.classList.remove("idle"); g.classList.add("shake");
    view.querySelector(".tap").style.visibility = "hidden";
    setTimeout(() => { g.classList.remove("shake"); g.classList.add("open"); document.getElementById("glow").classList.add("burst"); }, 900);
    setTimeout(() => { confetti(); renderReveal(me, true); }, 1700);
  };
  g.onclick = open; g.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
}

function renderReveal(me, fresh){
  current = "reveal";
  const who = TEST ? fakeFor(me) : decode(me);
  const letters = [...who].map((ch,i) => ch===" " ? `<span class="sp"> </span>` : `<span style="animation-delay:${(fresh?.45:.1)+i*.07}s">${esc(ch)}</span>`).join("");
  show(`
    <div class="reveal">
      <div class="eyebrow">${esc(me)}, el teu amic invisible és</div>
      <div class="card"><div class="who" aria-label="${esc(who)}">${letters}</div><small>Bon Nadal 🎄</small></div>
      <p class="hush">Que no se n’assabenti ningú. Guarda el secret fins al dia dels regals.</p>
      <div class="actions">${TEST ? '<button class="btn" id="restart">Provar-ho un altre cop</button>' : '<button class="btn ghost" id="hide">Amagar</button>'}</div>
    </div>`);
  if(TEST){ document.getElementById("restart").onclick = () => { selected = null; renderIntro(); }; return; }
  document.getElementById("hide").onclick = () => renderLocked(me);
}

function renderLocked(me){
  current = "locked";
  show(`
    <div class="ornament" aria-hidden="true"><div class="cap"></div><div class="ball"></div></div>
    <h2>Ja tens el teu<br>amic invisible</h2>
    <p class="lead">Aquest dispositiu està vinculat a <b style="color:var(--gold)">${esc(me)}</b>. Pots tornar a veure el teu resultat quan vulguis.</p>
    <div class="actions"><button class="btn" id="again">Tornar-ho a veure</button></div>`);
  document.getElementById("again").onclick = () => renderReveal(me, false);
}

/* Snow */
(() => {
  const c = document.getElementById("snow"), x = c.getContext("2d");
  let W, H, flakes = [], dpr = Math.min(devicePixelRatio||1, 2);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W = c.width = innerWidth*dpr; H = c.height = innerHeight*dpr;
    flakes = Array.from({length: Math.round(innerWidth/9)}, () => ({x:Math.random()*W, y:Math.random()*H, r:(Math.random()*2.2+.6)*dpr, s:(Math.random()*.6+.25)*dpr, w:Math.random()*6.28, o:Math.random()*.6+.25})); }
  function tick(){ x.clearRect(0,0,W,H);
    for(const f of flakes){ f.y += f.s; f.w += .01; f.x += Math.sin(f.w)*.35*dpr;
      if(f.y > H+5){ f.y = -5; f.x = Math.random()*W; }
      x.globalAlpha = f.o; x.fillStyle = "#fff"; x.beginPath(); x.arc(f.x,f.y,f.r,0,6.283); x.fill(); }
    if(!reduce) requestAnimationFrame(tick); }
  addEventListener("resize", size); size(); tick();
})();

/* Confetti burst */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), x = c.getContext("2d"), dpr = Math.min(devicePixelRatio||1,2);
  c.width = innerWidth*dpr; c.height = innerHeight*dpr;
  const cols = ["#d7263d","#e9c46a","#f6f2ea","#2f7d57","#ff8a95"];
  const ps = Array.from({length:160}, () => { const a = Math.random()*Math.PI*2, v = (Math.random()*9+4)*dpr;
    return {x:c.width/2, y:c.height*.42, vx:Math.cos(a)*v, vy:Math.sin(a)*v-6*dpr, w:(Math.random()*6+4)*dpr, h:(Math.random()*10+6)*dpr, r:Math.random()*6, vr:(Math.random()-.5)*.3, col:cols[Math.random()*cols.length|0]}; });
  let t = 0;
  (function f(){ x.clearRect(0,0,c.width,c.height); t++;
    for(const p of ps){ p.vy += .25*dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha = Math.max(0,1-t/200); x.fillStyle = p.col; x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))); x.restore(); }
    if(t < 200) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

/* Start */
function start(){
  TEST = location.hash === "#prova";
  document.getElementById("testbar").hidden = !TEST;
  selected = null;
  const me = store.get();
  if(me && ENC[me]) renderLocked(me); else renderIntro();
}
addEventListener("hashchange", start);
start();
</script>
